<head>

<body>
<title>La Ruée vers l'Or</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: a mine-shaft night scene; the question card is a plank-framed board, teams' sacks of nuggets line the top. Single dark look by choice. */
:root {
  --earth: #1d1611;
  --rock: #2b211a;
  --plank: #4a3524;
  --plank-hi: #6b4b31;
  --gold: #f1b52e;
  --gold-deep: #b97a12;
  --ore: #f7e3b0;
  --ink: #f4ead8;
  --muted: #b9a68c;
  --ok: #5fbf6e;
  --bad: #e2604a;
  --challenge: #ff8a3d;
  --f-display: "Rye", "Rockwell", Georgia, serif;
  --f-body: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #3a2a1c 0%, var(--earth) 60%) fixed, var(--earth);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
* { box-sizing: border-box; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; color: var(--gold); margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: .5px; text-shadow: 0 2px 0 #6b420a; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
.iconbtn { background: var(--rock); color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 8px 12px; font-size: 15px; }

/* Nugget */
.nug { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }

/* Teams strip */
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.team { background: var(--rock); border: 2px solid var(--plank); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .2s, transform .2s; }
.team.active { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 18px #f1b52e22; }
.team .name { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .score { font-family: var(--f-display); color: var(--gold); font-size: 30px; line-height: 1; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.team .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.team.bump .score { animation: bump .6s ease; }
.team { position: relative; padding-left: 24px; }
.team::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--pc, var(--plank)); border-radius: 10px 0 0 10px; }
.team .name { color: var(--pc, var(--ink)); }
.team.active { border-color: var(--pc, var(--gold)); box-shadow: 0 0 0 3px var(--pc, var(--gold)), 0 6px 18px #0006; }
.board.player { box-shadow: 0 0 0 6px var(--pc), 0 10px 30px #0008; }
.turn strong { color: var(--pc, var(--ink)); }
.turn .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); margin-right: 8px; vertical-align: 1px; }
.duelbox .who { border: 2px solid var(--pc); color: var(--pc); }
.rank .nm { color: var(--pc, var(--ink)); }
.names input[style] { border: 2px solid var(--pc); border-left-width: 12px; color: var(--pc); font-weight: 700; }
.credit { text-align: right; color: var(--muted); font-size: 14px; padding-top: 4px; }
.credit .cl { display: inline-block; transform: scaleX(-1); }
.team.target { border-color: var(--bad); box-shadow: 0 0 0 3px #e2604a33; }
.board .ribbon.raid { background: var(--bad); box-shadow: 0 3px 0 #7a2416; }
.rule.raid .big { color: var(--bad); }
.rule.duel .big { color: #ff8a3d; }
.rule.rescue .big { color: var(--ok); }
.board .ribbon.rescue { background: var(--ok); color: #0e2a12; box-shadow: 0 3px 0 #2c6a35; }
.board .ribbon.duel { background: #ff8a3d; color: #2a1200; box-shadow: 0 3px 0 #7a3410; }
.team.duelist { border-color: #ff8a3d; box-shadow: 0 0 0 3px #ff8a3d33; }
.duelbox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; font-weight: 800; }
.draw { font-family: var(--f-display); text-align: center; font-size: 54px; line-height: 1.1; color: #ff8a3d; min-height: 64px; text-shadow: 0 3px 0 #7a3410; }
.draw.go { color: var(--gold); text-shadow: 0 3px 0 #6b420a; animation: drop .35s cubic-bezier(.2,1.6,.4,1); }
.duelbox .vs { font-family: var(--f-display); color: #ff8a3d; font-size: 22px; }
.duelbox .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px; border-radius: 8px; background: #120d09; }
.duelbox .who.now { outline: 2px solid var(--gold); }
@keyframes bump { 30% { transform: scale(1.35); } }

/* Play area */
.play { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .play { grid-template-columns: 1fr; } }
.board { background: linear-gradient(var(--plank-hi), var(--plank)); padding: 10px; border-radius: 14px; box-shadow: 0 10px 30px #0008, inset 0 0 0 2px #00000030; position: relative; }
.board img { display: block; width: 100%; height: auto; border-radius: 6px; background: #fff; max-height: 72vh; object-fit: contain; }
.board .ribbon { position: absolute; top: -12px; left: 18px; background: var(--challenge); color: #2a1200; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; padding: 5px 12px; border-radius: 6px; box-shadow: 0 3px 0 #8a3c0c; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--rock); border: 1px solid var(--plank); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.turn { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
.turn strong { display: block; color: var(--ink); font-size: 26px; letter-spacing: 0; text-transform: none; font-weight: 800; }
.progress { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stake { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.stake .nugs { color: var(--gold); font-size: 22px; display: inline-flex; gap: 2px; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { font-family: var(--f-display); font-size: 34px; padding: 14px 0; border-radius: 12px; border: 2px solid var(--gold-deep); background: linear-gradient(#3b2d20, #2a1f16); color: var(--gold); box-shadow: 0 4px 0 #120d09; transition: transform .08s, background .2s; }
.ans:hover:not(:disabled) { background: linear-gradient(#4a3826, #33261b); }
.ans:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #120d09; }
.ans:disabled { cursor: default; opacity: .45; }
.ans.right { background: var(--ok); color: #0e2a12; border-color: var(--ok); opacity: 1; }
.ans.wrong { background: var(--bad); color: #2a0b05; border-color: var(--bad); opacity: 1; }

.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; align-items: baseline; }
.timer .secs { font-family: var(--f-display); font-size: 34px; color: var(--challenge); font-variant-numeric: tabular-nums; }
.bar { height: 12px; background: #120d09; border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bad), var(--challenge), var(--gold)); width: 100%; transition: width .1s linear; }
.timer.low .secs { animation: pulse .5s infinite alternate; }
@keyframes pulse { to { color: var(--bad); } }

.feedback { border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 18px; }
.feedback.ok { background: #5fbf6e22; color: #a7e8b0; border: 1px solid var(--ok); }
.feedback.ko { background: #e2604a22; color: #f6b3a7; border: 1px solid var(--bad); }
.primary { background: linear-gradient(var(--gold), var(--gold-deep)); color: #2a1a03; border: 0; border-radius: 12px; padding: 14px 18px; font-size: 19px; font-weight: 800; box-shadow: 0 4px 0 #6b420a; }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b420a; }
.ghost { background: transparent; color: var(--muted); border: 1px solid var(--plank-hi); border-radius: 10px; padding: 9px 12px; font-size: 15px; }
.keys { color: var(--muted); font-size: 13px; }

/* Setup */
.setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .setup { grid-template-columns: 1fr; } }
.setup h2 { font-family: var(--f-display); font-weight: 400; color: var(--gold); margin: 0; font-size: 24px; }
.setup p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 60ch; }
.rules { display: grid; gap: 10px; }
.rule { display: flex; gap: 12px; align-items: center; background: #120d0966; border-radius: 10px; padding: 10px 12px; }
.rule .big { font-family: var(--f-display); color: var(--gold); font-size: 26px; min-width: 2.2em; display: flex; align-items: center; gap: 4px; }
.rule.ch .big { color: var(--gold); text-shadow: 0 0 12px #f1b52e99; }
@keyframes shine { to { background-position: -200% center; } }
.board .ribbon.filon { background: linear-gradient(110deg, #b97a12 0%, #f1b52e 30%, #fff4c4 50%, #f1b52e 70%, #b97a12 100%); background-size: 200% auto; color: #2a1a03; box-shadow: 0 3px 0 #6b420a, 0 0 16px #f1b52e88; animation: shine 2.5s linear infinite; }
.overlay .title.filon { background: linear-gradient(110deg, #b97a12 0%, #f1b52e 30%, #fff4c4 50%, #f1b52e 70%, #b97a12 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 3px 0 #6b420a); animation: drop .5s cubic-bezier(.2,1.6,.4,1), shine 2.5s linear infinite; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: #120d09; color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 8px 12px; font-size: 15px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #2a1a03; border-color: var(--gold); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.names input { width: 100%; background: #120d09; color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-family: inherit; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-weight: 500; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.checks input { accent-color: var(--gold); width: 18px; height: 18px; }
.err { color: #f6b3a7; font-size: 14px; }

/* Overlay */
.overlay { position: fixed; inset: 0; background: #0b0806e6; display: grid; place-items: center; z-index: 20; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.overlay .box { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 520px; }
.overlay .title { font-family: var(--f-display); color: var(--challenge); font-size: clamp(34px, 7vw, 60px); line-height: 1.1; text-wrap: balance; text-shadow: 0 4px 0 #6b2a05; animation: drop .5s cubic-bezier(.2,1.6,.4,1); }
.overlay p { margin: 0; font-size: 20px; color: var(--ore); }
@keyframes drop { from { transform: translateY(-40px) scale(.8); opacity: 0; } }

/* End */
.podium { display: flex; flex-direction: column; gap: 10px; }
.rank { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--rock); border: 1px solid var(--plank); border-radius: 12px; padding: 12px 16px; }
.rank.first { border: 2px solid var(--gold); box-shadow: 0 0 30px #f1b52e33; }
.rank .pos { font-family: var(--f-display); font-size: 30px; color: var(--muted); text-align: center; }
.rank.first .pos { color: var(--gold); }
.rank .nm { font-weight: 800; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .det { color: var(--muted); font-size: 14px; }
.rank .pts { font-family: var(--f-display); color: var(--gold); font-size: 32px; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }

/* Flying nuggets */
.fly { position: fixed; z-index: 30; width: 34px; height: 34px; pointer-events: none; transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; }

/* phone layout: everything for one question fits on one screen */
@media (max-width: 600px) {
  body { padding-block: 6px 12px; font-size: 15px; }
  .wrap { gap: 8px; }
  header.top { gap: 6px; }
  h1 { font-size: 22px; }
  .top .sub { font-size: 10px; letter-spacing: 1px; }
  .iconbtn { padding: 5px 8px; font-size: 12px; }
  .teams { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
  .team { flex: 0 0 auto; min-width: 92px; padding: 5px 8px 5px 18px; gap: 0; }
  .team::before { width: 8px; }
  .team .name { font-size: 13px; }
  .team .score { font-size: 20px; }
  .team .meta { display: none; }
  .team.active { transform: none; }
  .play { gap: 8px; }
  .board { padding: 4px; border-radius: 10px; }
  .board img { max-height: none; }
  .board .ribbon { top: -9px; left: 10px; font-size: 10px; padding: 3px 8px; }
  .panel { padding: 10px; gap: 8px; border-radius: 10px; }
  .turn { font-size: 11px; }
  .turn strong { font-size: 18px; }
  .progress, .stake { font-size: 13px; }
  .stake .nugs { font-size: 16px; }
  .timer .secs { font-size: 22px; }
  .bar { height: 8px; }
  .answers { gap: 8px; }
  .ans { font-size: 24px; padding: 8px 0; border-radius: 10px; }
  .feedback { font-size: 15px; padding: 8px 10px; }
  .primary { padding: 11px 14px; font-size: 16px; }
  .draw { font-size: 34px; min-height: 40px; }
  .duelbox .who { font-size: 13px; padding: 4px; }
  .overlay .title { font-size: 32px; }
  .overlay p { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.primary:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: 0 4px 0 #6b420a; }
[hidden] { display: none !important; }
</style>

<style>
.panel h2 { font-family: var(--f-display); font-weight: 400; color: var(--gold); margin: 0; font-size: 24px; }
.panel p { margin: 0; color: var(--muted); line-height: 1.5; }
.muted { color: var(--muted); }
.menu .primary { width: 100%; }
.feedback { background: #120d0966; border: 1px solid var(--plank-hi); }
.ans.picked { background: var(--gold); color: #2a1a03; opacity: 1; }
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.live { display: grid; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .lobby, .live { grid-template-columns: 1fr; } }
.codebig { font-family: var(--f-display); font-size: clamp(48px, 9vw, 104px); line-height: 1; color: var(--gold); letter-spacing: 8px; text-align: center; text-shadow: 0 4px 0 #6b420a; }
.qr { background: #fff; border-radius: 12px; padding: 10px; width: min(300px, 100%); margin: 0 auto; }
.qr svg, .qr img { display: block; width: 100%; height: auto; }
.url { text-align: center; color: var(--ore); word-break: break-all; font-size: 16px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--pc); color: var(--pc); border-radius: 999px; padding: 4px 10px; font-weight: 700; background: #120d09; }
.chip.off { opacity: .45; }
.lb { list-style: none; margin: 0; padding: 0; columns: 2 360px; column-gap: 14px; }
.lbrow { break-inside: avoid; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: #120d0966; border-radius: 10px; padding: 8px 12px 8px 18px; margin-bottom: 8px; position: relative; }
.lbrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; border-radius: 10px 0 0 10px; background: var(--pc); }
.lbrow .pos { font-family: var(--f-display); color: var(--muted); font-size: 22px; text-align: center; }
.lbrow .nm { font-weight: 800; font-size: 18px; color: var(--pc); }
.lbrow .prog { display: block; height: 6px; background: #120d09; border-radius: 3px; overflow: hidden; margin-top: 5px; }
.lbrow .prog i { display: block; height: 100%; background: var(--pc); transition: width .4s; }
.lbrow .pts { font-family: var(--f-display); color: var(--gold); font-size: 26px; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 5px; padding: 2px 6px; margin-left: 8px; vertical-align: 2px; white-space: nowrap; }
.tag.duel { background: #ff8a3d; color: #2a1200; }
.tag.rescue { background: var(--ok); color: #0e2a12; }
.tag.raid { background: var(--bad); color: #2a0b05; }
.tag.filon { background: linear-gradient(110deg, #b97a12, #fff4c4, #f1b52e); color: #2a1a03; }
.tag.done { background: var(--plank-hi); color: var(--ink); }
.tag.off { background: #120d09; color: var(--muted); border: 1px solid var(--plank-hi); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; }
.feed li { background: #120d0966; border-radius: 8px; padding: 8px 10px; font-size: 15px; border-left: 4px solid var(--plank-hi); }
.feed li.duel { border-color: #ff8a3d; } .feed li.rescue { border-color: var(--ok); } .feed li.raid { border-color: var(--bad); } .feed li.filon { border-color: var(--gold); }
.mebar { display: flex; align-items: center; gap: 12px; background: var(--rock); border: 2px solid var(--pc); border-radius: 12px; padding: 6px 12px; }
.mebar .nm { font-weight: 800; color: var(--pc); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; }
.mebar .sc { font-family: var(--f-display); color: var(--gold); font-size: 24px; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.mebar .rk { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 40; background: #2b211a; border: 2px solid var(--gold); color: var(--ore); border-radius: 12px; padding: 10px 14px; font-weight: 700; width: max-content; max-width: min(92vw, 520px); box-shadow: 0 8px 24px #000a; animation: drop .4s; transition: top .3s; }
.banner { background: #e2604a22; border: 1px solid var(--bad); color: #f6b3a7; border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.status { color: #f6b3a7; font-size: 14px; max-width: 360px; }
.joinbox { max-width: 480px; margin: 0 auto; width: 100%; }
.joinbox input { background: #120d09; color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 12px; font-size: 20px; font-family: inherit; width: 100%; }
#jc { font-family: var(--f-display); letter-spacing: 8px; text-transform: uppercase; font-size: 30px; text-align: center; }
.rank .nm { min-width: 0; }
