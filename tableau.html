<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}.primary:disabled { opacity: .6; cursor: wait; transform: none; box-shadow: 0 4px 0 #6b420a; }
.ico { width: 1.25em; height: 1.25em; vertical-align: -0.28em; }
.invs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.inv { display: inline-flex; align-items: center; gap: 1px; font-size: 13px; font-weight: 800; color: var(--ore); }
.usebar { display: flex; flex-wrap: wrap; gap: 6px; }
.usebtn { background: #120d09; color: var(--ink); border: 1px solid var(--gold-deep); border-radius: 10px; padding: 6px 10px; font-weight: 700; font-size: 15px; display: inline-flex; gap: 6px; align-items: center; font-family: inherit; cursor: pointer; }
.usebtn:hover:not(:disabled) { border-color: var(--gold); }
.usebtn:disabled { opacity: .4; cursor: default; }
.hint { background: #fff4c41a; border: 1px solid var(--gold); color: var(--ore); border-radius: 10px; padding: 8px 12px; font-size: 16px; line-height: 1.4; }

.rule.item { align-items: flex-start; }

.fpb { width: 34px; height: 30px; border-radius: 7px; border: 1px solid var(--gold-deep); background: #2a1f16; color: var(--gold); font-weight: 800; font-family: inherit; cursor: pointer; }
.fpb.picked { background: var(--gold); color: #2a1a03; }
.fpb.right { background: var(--ok); color: #0e2a12; border-color: var(--ok); }
.fpb.wrong { background: var(--bad); color: #2a0b05; border-color: var(--bad); }

.backbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b420a; }
.backbtn:focus-visible { outline: 3px solid #fff4c4; outline-offset: 2px; }
.backbtn.armed { background: linear-gradient(#ff9f7a, var(--bad)); color: #2a0b05; }
@media (max-width: 600px) { .backbtn { padding: 6px 10px 6px 8px; font-size: 14px; border-radius: 10px; } .backbtn svg { width: 18px; height: 18px; } .ttl { gap: 8px; } }

<body>
<title>La Ruée vers l'Or</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: a mine-shaft night scene; the question card is a plank-framed board, teams' sacks of nuggets line the top. Single dark look by choice. */
:root {
  --earth: #1d1611;
  --rock: #2b211a;
  --plank: #4a3524;
  --plank-hi: #6b4b31;
  --gold: #f1b52e;
  --gold-deep: #b97a12;
  --ore: #f7e3b0;
  --ink: #f4ead8;
  --muted: #b9a68c;
  --ok: #5fbf6e;
  --bad: #e2604a;
  --challenge: #ff8a3d;
  --f-display: "Rye", "Rockwell", Georgia, serif;
  --f-body: "Alegreya Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(ellipse at 50% -10%, #3a2a1c 0%, var(--earth) 60%) fixed, var(--earth);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
* { box-sizing: border-box; }
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; color: var(--gold); margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: .5px; text-shadow: 0 2px 0 #6b420a; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
.iconbtn { background: var(--rock); color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 8px 12px; font-size: 15px; }

/* Nugget */
.nug { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; }

/* Teams strip */
.teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.team { background: var(--rock); border: 2px solid var(--plank); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .2s, transform .2s; }
.team.active { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 18px #f1b52e22; }
.team .name { font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team .score { font-family: var(--f-display); color: var(--gold); font-size: 30px; line-height: 1; display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.team .meta { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.team.bump .score { animation: bump .6s ease; }
.team { position: relative; padding-left: 24px; }
.team::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: var(--pc, var(--plank)); border-radius: 10px 0 0 10px; }
.team .name { color: var(--pc, var(--ink)); }
.team.active { border-color: var(--pc, var(--gold)); box-shadow: 0 0 0 3px var(--pc, var(--gold)), 0 6px 18px #0006; }
.board.player { box-shadow: 0 0 0 6px var(--pc), 0 10px 30px #0008; }
.turn strong { color: var(--pc, var(--ink)); }
.turn .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--pc); margin-right: 8px; vertical-align: 1px; }
.duelbox .who { border: 2px solid var(--pc); color: var(--pc); }
.rank .nm { color: var(--pc, var(--ink)); }
.names input[style] { border: 2px solid var(--pc); border-left-width: 12px; color: var(--pc); font-weight: 700; }
.credit { text-align: right; color: var(--muted); font-size: 14px; padding-top: 4px; }
.credit .cl { display: inline-block; transform: scaleX(-1); }
.team.target { border-color: var(--bad); box-shadow: 0 0 0 3px #e2604a33; }
.board .ribbon.raid { background: var(--bad); box-shadow: 0 3px 0 #7a2416; }
.rule.raid .big { color: var(--bad); }
.rule.duel .big { color: #ff8a3d; }
.rule.rescue .big { color: var(--ok); }
.board .ribbon.rescue { background: var(--ok); color: #0e2a12; box-shadow: 0 3px 0 #2c6a35; }
.board .ribbon.duel { background: #ff8a3d; color: #2a1200; box-shadow: 0 3px 0 #7a3410; }
.team.duelist { border-color: #ff8a3d; box-shadow: 0 0 0 3px #ff8a3d33; }
.duelbox { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; font-weight: 800; }
.draw { font-family: var(--f-display); text-align: center; font-size: 54px; line-height: 1.1; color: #ff8a3d; min-height: 64px; text-shadow: 0 3px 0 #7a3410; }
.draw.go { color: var(--gold); text-shadow: 0 3px 0 #6b420a; animation: drop .35s cubic-bezier(.2,1.6,.4,1); }
.duelbox .vs { font-family: var(--f-display); color: #ff8a3d; font-size: 22px; }
.duelbox .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 6px; border-radius: 8px; background: #120d09; }
.duelbox .who.now { outline: 2px solid var(--gold); }
@keyframes bump { 30% { transform: scale(1.35); } }

/* Play area */
.play { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .play { grid-template-columns: 1fr; } }
.board { background: linear-gradient(var(--plank-hi), var(--plank)); padding: 10px; border-radius: 14px; box-shadow: 0 10px 30px #0008, inset 0 0 0 2px #00000030; position: relative; }
.board img { display: block; width: 100%; height: auto; border-radius: 6px; background: #fff; max-height: 72vh; object-fit: contain; }
.board .ribbon { position: absolute; top: -12px; left: 18px; background: var(--challenge); color: #2a1200; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; padding: 5px 12px; border-radius: 6px; box-shadow: 0 3px 0 #8a3c0c; }

.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--rock); border: 1px solid var(--plank); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.turn { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
.turn strong { display: block; color: var(--ink); font-size: 26px; letter-spacing: 0; text-transform: none; font-weight: 800; }
.progress { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.stake { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.stake .nugs { color: var(--gold); font-size: 22px; display: inline-flex; gap: 2px; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { font-family: var(--f-display); font-size: 34px; padding: 14px 0; border-radius: 12px; border: 2px solid var(--gold-deep); background: linear-gradient(#3b2d20, #2a1f16); color: var(--gold); box-shadow: 0 4px 0 #120d09; transition: transform .08s, background .2s; }
.ans:hover:not(:disabled) { background: linear-gradient(#4a3826, #33261b); }
.ans:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #120d09; }
.ans:disabled { cursor: default; opacity: .45; }
.ans.right { background: var(--ok); color: #0e2a12; border-color: var(--ok); opacity: 1; }
.ans.wrong { background: var(--bad); color: #2a0b05; border-color: var(--bad); opacity: 1; }

.timer { display: flex; flex-direction: column; gap: 6px; }
.timer .row { display: flex; justify-content: space-between; align-items: baseline; }
.timer .secs { font-family: var(--f-display); font-size: 34px; color: var(--challenge); font-variant-numeric: tabular-nums; }
.bar { height: 12px; background: #120d09; border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--bad), var(--challenge), var(--gold)); width: 100%; transition: width .1s linear; }
.timer.low .secs { animation: pulse .5s infinite alternate; }
@keyframes pulse { to { color: var(--bad); } }

.feedback { border-radius: 10px; padding: 12px 14px; font-weight: 700; font-size: 18px; }
.feedback.ok { background: #5fbf6e22; color: #a7e8b0; border: 1px solid var(--ok); }
.feedback.ko { background: #e2604a22; color: #f6b3a7; border: 1px solid var(--bad); }
.primary { background: linear-gradient(var(--gold), var(--gold-deep)); color: #2a1a03; border: 0; border-radius: 12px; padding: 14px 18px; font-size: 19px; font-weight: 800; box-shadow: 0 4px 0 #6b420a; }
.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #6b420a; }
.ghost { background: transparent; color: var(--muted); border: 1px solid var(--plank-hi); border-radius: 10px; padding: 9px 12px; font-size: 15px; }
.keys { color: var(--muted); font-size: 13px; }

/* Setup */
.setup { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .setup { grid-template-columns: 1fr; } }
.setup h2 { font-family: var(--f-display); font-weight: 400; color: var(--gold); margin: 0; font-size: 24px; }
.setup p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 60ch; }
.rules { display: grid; gap: 10px; }
.rule { display: flex; gap: 12px; align-items: center; background: #120d0966; border-radius: 10px; padding: 10px 12px; }
.rule .big { font-family: var(--f-display); color: var(--gold); font-size: 26px; min-width: 2.2em; display: flex; align-items: center; gap: 4px; }
.rule.ch .big { color: var(--gold); text-shadow: 0 0 12px #f1b52e99; }
@keyframes shine { to { background-position: -200% center; } }
.board .ribbon.filon { background: linear-gradient(110deg, #b97a12 0%, #f1b52e 30%, #fff4c4 50%, #f1b52e 70%, #b97a12 100%); background-size: 200% auto; color: #2a1a03; box-shadow: 0 3px 0 #6b420a, 0 0 16px #f1b52e88; animation: shine 2.5s linear infinite; }
.overlay .title.filon { background: linear-gradient(110deg, #b97a12 0%, #f1b52e 30%, #fff4c4 50%, #f1b52e 70%, #b97a12 100%); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 3px 0 #6b420a); animation: drop .5s cubic-bezier(.2,1.6,.4,1), shine 2.5s linear infinite; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { background: #120d09; color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 8px 12px; font-size: 15px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--gold); color: #2a1a03; border-color: var(--gold); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.names input { width: 100%; background: #120d09; color: var(--ink); border: 1px solid var(--plank-hi); border-radius: 8px; padding: 9px 10px; font-size: 16px; font-family: inherit; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-weight: 500; }
.checks label { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.checks input { accent-color: var(--gold); width: 18px; height: 18px; }
.err { color: #f6b3a7; font-size: 14px; }

/* Overlay */
.overlay { position: fixed; inset: 0; background: #0b0806e6; display: grid; place-items: center; z-index: 20; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.overlay .box { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; max-width: 520px; }
.overlay .title { font-family: var(--f-display); color: var(--challenge); font-size: clamp(34px, 7vw, 60px); line-height: 1.1; text-wrap: balance; text-shadow: 0 4px 0 #6b2a05; animation: drop .5s cubic-bezier(.2,1.6,.4,1); }
.overlay p { margin: 0; font-size: 20px; color: var(--ore); }
@keyframes drop { from { transform: translateY(-40px) scale(.8); opacity: 0; } }

/* End */
.podium { display: flex; flex-direction: column; gap: 10px; }
.rank { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 12px; background: var(--rock); border: 1px solid var(--plank); border-radius: 12px; padding: 12px 16px; }
.rank.first { border: 2px solid var(--gold); box-shadow: 0 0 30px #f1b52e33; }
.rank .pos { font-family: var(--f-display); font-size: 30px; color: var(--muted); text-align: center; }
.rank.first .pos { color: var(--gold); }
.rank .nm { font-weight: 800; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .det { color: var(--muted); font-size: 14px; }
.rank .pts { font-family: var(--f-display); color: var(--gold); font-size: 32px; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }

/* Flying nuggets */
.fly { position: fixed; z-index: 30; width: 34px; height: 34px; pointer-events: none; transition: transform .9s cubic-bezier(.5,-0.3,.6,1), opacity .9s; }

/* phone layout: everything for one question fits on one screen */
@media (max-width: 600px) {
  body { padding-block: 6px 12px; font-size: 15px; }
  .wrap { gap: 8px; }
  header.top { gap: 6px; }
  h1 { font-size: 22px; }
  .top .sub { font-size: 10px; letter-spacing: 1px; }
  .iconbtn { padding: 5px 8px; font-size: 12px; }
  .teams { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
  .team { flex: 0 0 auto; min-width: 92px; padding: 5px 8px 5px 18px; gap: 0; }
  .team::before { width: 8px; }
  .team .name { font-size: 13px; }
  .team .score { font-size: 20px; }
  .team .meta { display: none; }
  .team.active { transform: none; }
  .play { gap: 8px; }
  .board { padding: 4px; border-radius: 10px; }
  .board img { max-height: none; }
  .board .ribbon { top: -9px; left: 10px; font-size: 10px; padding: 3px 8px; }
  .panel { padding: 10px; gap: 8px; border-radius: 10px; }
  .turn { font-size: 11px; }
  .turn strong { font-size: 18px; }
  .progress, .stake { font-size: 13px; }
  .stake .nugs { font-size: 16px; }
  .timer .secs { font-size: 22px; }
  .bar { height: 8px; }
  .answers { gap: 8px; }
  .ans { font-size: 24px; padding: 8px 0; border-radius: 10px; }
  .feedback { font-size: 15px; padding: 8px 10px; }
  .primary { padding: 11px 14px; font-size: 16px; }
  .draw { font-size: 34px; min-height: 40px; }
  .duelbox .who { font-size: 13px; padding: 4px; }
  .overlay .title { font-size: 32px; }
  .overlay p { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>

      ${S.teams.map((o, i) => o === owner ? "" : `<div class="fprow" style="--pc:${pc(i)}"><span class="fpname">${esc(o.name)}</span><span class="fpbtns">${["a", "b", "c", "d"].map(l => {
        const pickd = S.fpart[i] === l, cls = done ? (l === right ? (pickd ? "right" : "") : pickd ? "wrong" : "") : pickd ? "picked" : "";
        return `<button class="fpb ${cls}" data-i="${i}" data-l="${l}" ${done ? "disabled" : ""} aria-pressed="${pickd}">${l.toUpperCase()}</button>`; }).join("")}</span></div>`).join("")}</div>`;
  }
  function bindFilonBox(done) {
    if (done) return;
    app.querySelectorAll(".fpb").forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      S.fpart[i] = S.fpart[i] === b.dataset.l ? undefined : b.dataset.l; // a second click removes the answer
      app.querySelectorAll(`.fpb[data-i="${i}"]`).forEach(x => { const on = S.fpart[i] === x.dataset.l; x.classList.toggle("picked", on); x.setAttribute("aria-pressed", on); });
    });
  }

  function teamsStrip() {
    return `<div class="teams">${S.teams.map((t, i) => `<div class="team ${S.phase === "play" && i === S.idx % S.teams.length ? "active" : ""} ${S.phase === "play" && isRaid() && i === S.victim ? "target" : ""}" id="team${i}" style="--pc:${pc(i)}">
      <span class="name">${esc(t.name)}</span>
      <span class="score">${NUG}<span>${t.score}</span></span>
      <span class="meta">${t.ok} / ${t.tot} bonnes réponses</span><span class="invs" id="inv${i}">${invHTML(t)}</span></div>`).join("")}</div>`;
  }

  function renderPlay(showIntro) {
    stopTimer();
    if (!S.answered) { S.victim = (S.raids || []).includes(S.idx) ? leaderIdx() : null; S.filonLot = 4; S.filonOn = true; }
    if (!S.answered && !S.duel && (S.duels || []).includes(S.idx) && S.teams.length > 1) S.duel = makeDuel();
    if (!S.answered && !S.duel && (S.rescues || []).includes(S.idx) && S.teams.length > 1) S.duel = makeRescue();
    // an event slot whose event cannot happen (no leader, no partner yet…) tries the other events
    if (!S.answered && !S.duel && !isRaid() && S.teams.length > 1 && [S.raids, S.duels, S.rescues].some(a => (a || []).includes(S.idx))
        && !(S.fallbackTried = S.fallbackTried || {})[S.idx]) {
      S.fallbackTried[S.idx] = true;
      for (const ev of shuffle(["raid", "duel", "rescue"])) {
        if (ev === "raid" && S.idx >= 2) { const v = leaderIdx(); if (v !== null) { S.raids.push(S.idx); S.victim = v; break; } }
        if (ev === "duel" && S.idx >= 3) { const d = makeDuel(); if (d) { S.duel = d; break; } }
        if (ev === "rescue" && S.idx >= 3) { const d = makeRescue(); if (d) { S.duel = d; break; } }
      }
    }
    if (!S.answered && !S.duel && !isRaid() && S.idx >= 2 && !(S.filonRolled = S.filonRolled || {})[S.idx]) {
      S.filonRolled[S.idx] = true;
      if (Math.random() < filonChance(S.idx % S.teams.length)) S.challenges.push(S.idx);
    }
    if (S.duel) return renderDuel();
    if (!S.answered && isFilon() && !(S.filonPicked || {})[S.idx]) pickFilonQuestion();
    const q = S.deck[S.idx], ch = isChallenge(), t = curTeam(), done = S.answered;
    const n = String(q).padStart(3, "0");
    app.innerHTML = header(`<button class="iconbtn" id="quit">Terminer la partie</button>`) + teamsStrip() + `
      <div class="play">
        <div class="board player" style="--pc:${pc(S.idx % S.teams.length)}">${isRaid() ? '<span class="ribbon raid">Chapardage</span>' : ch ? '<span class="ribbon filon">Filon</span>' : ""}
          <img data-q="${q}" alt="Question ${q} : énoncé, figure et réponses a, b, c, d" width="1200" height="1050">
        </div>
        <div class="side">
          <div class="panel">
            <div class="turn" style="--pc:${pc(S.idx % S.teams.length)}">À toi de creuser<strong><span class="dot"></span>${esc(t.name)}</strong></div>
            <div class="progress">Question ${S.idx + 1} sur ${S.deck.length}</div>
            <div class="stake">En jeu : <span class="nugs">${nugs(done && done.k != null ? done.k : stakeOf())}</span> ${done && done.k != null ? done.k : stakeOf()} pépite${(done && done.k != null ? done.k : stakeOf()) > 1 ? "s" : ""}${isRaid() ? ` à chaparder à ${esc(victim().name)}` : ""}</div>
            ${isRaid() ? `<div class="feedback ko" style="font-size:16px">Le shérif veille ! Si tu te trompes, tu paies 1 pépite d'amende à ${esc(victim().name)}.</div><div class="timer" id="timer"><div class="row"><span>Temps restant</span><span class="secs" id="secs">${ETIME} s</span></div><div class="bar"><i id="barfill"></i></div></div>` : ch ? `<div class="timer" id="timer"><div class="row"><span>Temps restant</span><span class="secs" id="secs">${S.filonLot || 4} pépite${(S.filonLot || 4) > 1 ? "s" : ""}</span></div><div class="bar"><i id="barfill"></i></div></div><div class="feedback ok" style="font-size:16px">Tu as le droit de demander de l'aide !</div>` : done ? "" : `<div class="timer" id="timer"><div class="row"><span>Temps restant</span><span class="secs" id="secs">${QTIME} s</span></div><div class="bar"><i id="barfill"></i></div></div>`}
            ${done ? "" : useBarHTML(t)}<div id="usefx"></div>
            ${ch && !isRaid() && S.teams.length > 1 ? filonBoxHTML(t, done) : ""}
            <div class="answers">${["a", "b", "c", "d"].map(l => `<button class="ans" data-l="${l}" ${done ? "disabled" : ""}>${l.toUpperCase()}</button>`).join("")}</div>
            <div id="fb"></div>
          </div>
        </div>
      </div>`;
    app.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(b.dataset.l, b));
    if (!done) bindUse(t, q); else showUse(q);
    if (ch && !isRaid()) bindFilonBox(done);
    document.getElementById("quit").onclick = () => { stopTimer(); S.phase = "end"; renderEnd(); };
    bindSound();
    if (done) showFeedback(done.choice, false);
    else if (ch) showChallengeIntro();
    else whenShown(() => startCountdown(QTIME));
  }
  // an event's start button stays disabled until its question is displayed behind the overlay
  const boardShown = () => { const im = document.querySelector(".board img"); return !!(im && im.complete && im.naturalWidth > 1 && /^data:image\/png/.test(im.src)); };
  function gateReady(btn) {
    if (!btn) return;
    const label = btn.textContent;
    const check = () => {
      if (!btn.isConnected) return;
      if (boardShown()) { btn.disabled = false; btn.textContent = label; btn.focus(); }
      else {
        btn.disabled = true; btn.textContent = "Chargement de la question…";
        const im = document.querySelector(".board img"); if (im && !im.getAttribute("src")) fillImgs(); // ask again for a pack that failed
        setTimeout(check, 400);
      }
    };
    check();
  }
  // run fn once the question image on the board is fully displayed (the timer must not run before)
  function whenShown(fn) {
    const id = S.idx, secs = document.getElementById("secs");
    if (secs) secs.textContent = "…";
    const check = () => {
      if (S.phase !== "play" || S.idx !== id) return;
      const im = document.querySelector(".board img");
      if (im && im.complete && im.naturalWidth > 1 && /^data:image\/png/.test(im.src)) {
        (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(() => { if (S.phase === "play" && S.idx === id) fn(); });
      } else {
        if (im && !im.getAttribute("src")) fillImgs(); // a pack that failed is asked again
        setTimeout(check, 150);
      }
    };
    check();
  }

  function showChallengeIntro() {
    beep("ch");
    const ov = document.createElement("div");
    ov.className = "overlay";
    const k = stakeOf();
    const body = isRaid()
      ? `<div class="title" style="color:var(--bad)">Chapardage !</div>
      <p>${esc(curTeam().name)}, réponds juste en <strong>${ETIME} secondes</strong> pour chaparder ${k} pépite${k > 1 ? "s" : ""} à <strong>${esc(victim().name)}</strong>, le plus riche de la mine.</p>
      <p>Mais attention, <strong>le shérif veille</strong> : si tu te trompes, tu paies 1 pépite d'amende à ${esc(victim().name)} !</p>
      <p style="color:var(--gold);font-size:28px;display:flex;gap:4px;align-items:center">${nugs(k)} <span style="margin-left:8px">${k} pépite${k > 1 ? "s" : ""} à chaparder</span></p>`
      : `<div class="title filon">Vous êtes tombés sur un filon !</div>
      <p>${esc(curTeam().name)}, tu as <strong>${FTIME} secondes</strong> pour trouver la bonne réponse. Si tu réussis, tu gagnes <strong>4 pépites</strong>. Les autres chercheurs peuvent donner leur réponse eux aussi : ceux qui trouvent gagnent <strong>1 pépite</strong>, mais seulement si <strong>tu trouves aussi</strong> !</p>
      <p>${S.filonFromMissed ? "C'est une question que tu n'as pas réussie, avec d'autres valeurs : retente ta chance ! " : ""}<strong>Tu as le droit de demander de l'aide !</strong></p>
      <p style="color:var(--gold);font-size:28px;display:flex;gap:4px;align-items:center">${nugs(4)} <span style="margin-left:8px">4 pépites</span></p>`;
    ov.innerHTML = `<div class="box">${body}
      <button class="primary" id="ready">C'est parti !</button></div>`;
    document.body.appendChild(ov);
    const go = () => { ov.remove(); whenShown(startTimer); };
    document.getElementById("ready").onclick = go;
    gateReady(document.getElementById("ready"));
  }

  // filon: no time limit, the jackpot drops from 4 to 1 nugget, one step every 10 s
  // filon question: one the player missed earlier (its twin, other values), else a random new one
  function pickFilonQuestion() {
    const t = curTeam();
    const solved = new Set(t.solved || []);
    const missed = [...new Set(t.failed || [])].filter(n => !solved.has(n) && !solved.has(twin(n)));
    let q;
    if (missed.length) q = twin(pick(missed)); // a question the player missed, with other values
    else {
      const used = new Set(S.deck);
      const inSeries = n => S.series === "AB" || (S.series === "B" ? isB(n) : !isB(n));
      const pool = QS.filter(([n, th]) => S.themes[th] && inSeries(n) && !used.has(n)).map(x => x[0]);
      q = pool.length ? pick(pool) : S.deck[S.idx];
    }
    S.filonFromMissed = missed.length > 0;
    S.deck[S.idx] = q;
    (S.filonPicked = S.filonPicked || {})[S.idx] = true;
  }

  function startFilon() {
    const STEP = 10000, t0 = performance.now();
    const secsEl = document.getElementById("secs"), fill = document.getElementById("barfill");
    S.filonLot = 4;
    timer = setInterval(() => {
      const el = performance.now() - t0;
      // filon: 40 s, fixed 4 nuggets (+1 for every other player)
      if (el >= FTIME * 1000) { stopTimer(); answer(null); return; }
      const left = Math.ceil((FTIME * 1000 - el) / 1000);
      secsEl.textContent = left + " s";
      fill.style.width = ((1 - el / (FTIME * 1000)) * 100) + "%";
    }, 100);
  }

  function startTimer() {
    if (!isRaid()) return startFilon();
    return startCountdown(ETIME); // chapardage: 20 s, and the sheriff fines a wrong answer
    const D = chSecs();
    deadline = performance.now() + D * 1000;
    const secsEl = document.getElementById("secs"), fill = document.getElementById("barfill"), box = document.getElementById("timer");
    let lastSec = D;
    timer = setInterval(() => {
      const left = Math.max(0, deadline - performance.now());
      const s = Math.ceil(left / 1000);
      secsEl.textContent = s + " s";
      fill.style.width = (left / (D * 1000) * 100) + "%";
      box.classList.toggle("low", s <= 5);
      if (s !== lastSec && s <= 5 && s > 0) beep("tick");
      lastSec = s;
      if (left <= 0) { stopTimer(); answer(null); }
    }, 100);
  }
  // normal questions: 30 s, then the answer counts as wrong
  const QTIME = 40, ETIME = 30, DTIME = 20, RTIME = 40, FTIME = 50; // normal questions / chapardage / castagne
  function startCountdown(D, onEnd, quiet) {
    stopTimer();
    const end = performance.now() + D * 1000;
    const secsEl = document.getElementById("secs"), fill = document.getElementById("barfill"), box = document.getElementById("timer");
    if (!secsEl) return;
    let lastSec = D;
    timer = setInterval(() => {
      const left = Math.max(0, end - performance.now());
      const s = Math.ceil(left / 1000);
      secsEl.textContent = s + " s";
      fill.style.width = (left / (D * 1000) * 100) + "%";
      box.classList.toggle("low", s <= 5);
      if (!quiet && s !== lastSec && s <= 5 && s > 0) beep("tick");
      lastSec = s;
      if (left <= 0) { stopTimer(); onEnd ? onEnd() : answer(null); }
    }, 100);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function answer(l) {
    if (S.answered) return;
    stopTimer();
    const q = S.deck[S.idx], right = ANSWER[q], t = curTeam();
    const ok = l === right;
    t.tot++;
    let k = stakeOf(), loot = "";
    if (ok && S.use && S.use.t === "pioche") k = isRaid() ? Math.min(victim().score, boost(k)) : boost(k);
    if (ok) {
      t.score += k; t.ok++; (t.solved = t.solved || []).push(q);
      if (isRaid()) {
        victim().score -= k; t.vols = (t.vols || 0) + 1;
        const st = stealItem(victim(), t);
        if (st) loot = ` ${esc(t.name)} lui vole aussi ${esc(son(st))} !`;
      }
      else if (isFilon()) {
        t.ch++;
        const winners = S.teams.filter((o, i) => o !== t && (S.fpart || {})[i] === right);
        winners.forEach(o => { o.score += 1; o.fa = (o.fa || 0) + 1; });
        if (winners.length) loot += ` +1 pépite pour ${winners.map(o => esc(o.name)).join(", ")}, qui ${winners.length > 1 ? "ont" : "a"} aussi trouvé.`;
      }
    }
    if (!ok) (t.failed = t.failed || []).push(q);
    let fine = 0;
    if (!ok && isRaid() && t.score > 0) { fine = 1; t.score -= 1; victim().score += 1; }
    S.answered = { choice: l, ok, k, fine, loot };
    app.querySelectorAll(".ans").forEach(b => b.disabled = true);
    showFeedback(l, true);
  }

  function showFeedback(l, animate) {
    const q = S.deck[S.idx], right = ANSWER[q], t = curTeam(), ok = l === right;
    const k = S.answered && S.answered.k != null ? S.answered.k : stakeOf();
    app.querySelectorAll(".ans").forEach(b => {
      if (b.dataset.l === right) b.classList.add("right");
      else if (b.dataset.l === l) b.classList.add("wrong");
    });
    const last = S.timeUp || S.idx === S.deck.length - 1;
    const msg = ok && isRaid() ? `Coup réussi ! ${esc(t.name)} chaparde ${k} pépite${k > 1 ? "s" : ""} à ${esc(victim().name)}.`
      : !ok && isRaid() ? (S.answered && S.answered.fine ? `Pris la main dans le sac ! La bonne réponse était ${right.toUpperCase()}. ${esc(t.name)} paie 1 pépite d'amende à ${esc(victim().name)}.` : `Pris la main dans le sac ! La bonne réponse était ${right.toUpperCase()}. ${esc(t.name)} n'a pas de pépite pour payer l'amende.`)
      : ok && isFilon() ? `Filon exploité ! +${k} pépites pour ${esc(t.name)}.`
      : ok ? `Bien joué ! +${k} pépite${k > 1 ? "s" : ""} pour ${esc(t.name)}.`
      : (l === null ? `Temps écoulé ! La bonne réponse était ${right.toUpperCase()}.` : `Raté ! La bonne réponse était ${right.toUpperCase()}.`);
    document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "ok" : "ko"}">${msg}${S.answered && S.answered.loot ? S.answered.loot : ""}</div>
      <button class="primary" id="next" style="margin-top:10px;width:100%">${last ? "Voir le classement" : "Question suivante"}</button>`;
    refreshInv();
    const nx = document.getElementById("next");
    nx.onclick = next; nx.focus();
    // refresh scores in place
    const ti = S.idx % S.teams.length, card = document.getElementById("team" + ti);
    card.querySelector(".score span").textContent = t.score;
    card.querySelector(".meta").textContent = `${t.ok} / ${t.tot} bonnes réponses`;
    const vcard = isRaid() ? document.getElementById("team" + S.victim) : null;
    if (vcard) vcard.querySelector(".score span").textContent = victim().score;
    if (ok && isFilon()) S.teams.forEach((o, i) => { const c = document.getElementById("team" + i); if (c) c.querySelector(".score span").textContent = o.score; });
    if (isFilon()) app.querySelectorAll(".fpb").forEach(b => {
      b.disabled = true; b.classList.remove("picked");
      const mine = (S.fpart || {})[+b.dataset.i] === b.dataset.l;
      if (mine) b.classList.add(b.dataset.l === right ? "right" : "wrong");
    });
    if (animate) {
      beep(ok ? "ok" : "ko");
      if (!ok && vcard && S.answered && S.answered.fine) flyNuggets(1, vcard, card);
      if (ok) { flyNuggets(k, card, ok ? vcard : null); setTimeout(() => { card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump"); }, 850); }
    }
  }

  function flyNuggets(n, target, from) {
    const src = (from ? from.querySelector(".score") : document.querySelector(".ans.right")).getBoundingClientRect();
    const dst = target.querySelector(".score").getBoundingClientRect();
    for (let i = 0; i < n; i++) {
      const el = document.createElement("div");
      el.className = "fly";
      el.innerHTML = '<svg width="34" height="34"><use href="#nugget"/></svg>';
      el.style.left = (src.left + src.width / 2 - 17 + (i - (n - 1) / 2) * 26) + "px";
      el.style.top = (src.top + src.height / 2 - 17) + "px";
      document.body.appendChild(el);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.transitionDelay = (i * 0.12) + "s";
        el.style.transform = `translate(${dst.left - parseFloat(el.style.left)}px, ${dst.top - parseFloat(el.style.top)}px) scale(.6) rotate(${200 + i * 40}deg)`;
        el.style.opacity = "0.2";
      }));
      setTimeout(() => el.remove(), 1400 + i * 120);
    }
  }

  /* ---------- Game clock ---------- */
  let clock = null;
  function clockText() {
    const left = Math.max(0, Math.ceil((S.endAt - Date.now()) / 1000));
    return Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  }
  function startClock() {
    if (clock) clearInterval(clock);
    clock = setInterval(() => {
      if (S.phase !== "play") { clearInterval(clock); clock = null; return; }
      const el = document.getElementById("gclock");
      if (Date.now() >= S.endAt && !S.timeUp) {
        S.timeUp = true;
        beep("ch");
        const nx = document.getElementById("next");
        if (nx) nx.textContent = "Voir le classement";
      }
      if (el) el.textContent = S.timeUp ? "0:00 — dernière question !" : clockText();
    }, 500);
  }

  /* ---------- Castagne (duel) ---------- */
  const themeLabel = id => (THEMES.find(t => t.id === id) || {}).label || "";
  // each duelist gets a question they already solved, with other values (its twin in the other series)
  const twin = n => n >= 10000 ? Math.floor(n / 10000) * 10000 + twinLocal(gidLevel(n).half, n % 10000) : twinLocal(HALF, n);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  function makeDuel() {
    const me = S.idx % S.teams.length;
    const solvedIn = (i, th) => [...new Set(S.teams[i].solved || [])].filter(n => THEME_OF[n] === th);
    const options = [];
    S.teams.forEach((_, opp) => {
      if (opp === me) return;
      THEMES.forEach(({ id }) => {
        if (solvedIn(me, id).length && solvedIn(opp, id).length) options.push([opp, id]);
      });
    });
    if (!options.length) return null; // nobody can duel yet: normal question instead
    const [opp, th] = pick(options);
    const q1 = twin(pick(solvedIn(me, th))), q2 = twin(pick(solvedIn(opp, th)));
    return { me, opp, q1, q2, th, step: 1, a1: null, a2: null, intro: false, done: false };
  }

  // sauvetage: each player gets a question they missed (other values), and they may help each other
  function makeRescue() {
    const me = S.idx % S.teams.length;
    const missedOf = i => {
      const t = S.teams[i], sv = new Set(t.solved || []);
      return [...new Set(t.failed || [])].filter(n => !sv.has(n) && !sv.has(twin(n)));
    };
    const mine = missedOf(me);
    if (!mine.length) return null;
    const partners = S.teams.map((_, i) => i).filter(i => i !== me && missedOf(i).length);
    if (!partners.length) return null; // nobody to team up with: normal question instead
    const opp = pick(partners);
    const q1 = twin(pick(mine));
    let other = missedOf(opp).map(twin).filter(n => n !== q1);
    if (!other.length) other = missedOf(opp).map(twin);
    return { kind: "rescue", me, opp, q1, q2: pick(other), th: null, step: 1, a1: null, a2: null, intro: false, done: false };
  }

  function renderDuel() {
    stopTimer();
    const d = S.duel;
    const pIdx = d.step === 1 ? d.me : d.opp;
    const p = S.teams[pIdx], q = d.step === 1 ? d.q1 : d.q2;
    const ans = d.step === 1 ? d.a1 : d.a2;
    const n = String(q).padStart(3, "0");
    const R = d.kind === "rescue";
    app.innerHTML = header(`<button class="iconbtn" id="quit">Terminer la partie</button>`) + teamsStrip() + `
      <div class="play">
        <div class="board player" style="--pc:${pc(pIdx)}">${R ? '<span class="ribbon rescue">Sauvetage</span>' : `<span class="ribbon duel">Castagne · ${esc(themeLabel(d.th))}</span>`}
          <img data-q="${q}" alt="Question de castagne : énoncé, figure et réponses a, b, c, d" width="1200" height="1050">
        </div>
        <div class="side">
          <div class="panel">
            <div class="turn" style="--pc:${pc(pIdx)}">${R ? "Sauvetage : à toi de répondre" : "Castagne : à toi de jouer"}<strong><span class="dot"></span>${esc(p.name)}</strong></div>
            <div class="duelbox"><span class="who ${d.step === 1 ? "now" : ""}" style="--pc:${pc(d.me)}">${esc(S.teams[d.me].name)}</span><span class="vs">${R ? "avec" : "contre"}</span><span class="who ${d.step === 2 ? "now" : ""}" style="--pc:${pc(d.opp)}">${esc(S.teams[d.opp].name)}</span></div>
            <div class="progress">Question ${S.idx + 1} sur ${S.deck.length} · ${R ? "sauvetage" : "duel"} ${d.step} / 2</div>
            <div class="stake">En jeu : <span class="nugs">${nugs(2)}</span> ${R ? "jusqu'à 2 pépites chacun" : "2 pépites"}</div>
            ${R && !ans ? '<div class="feedback ok" style="font-size:16px">Vous avez le droit de vous entraider !</div>' : ""}
            ${ans || R ? "" : '<div class="draw" id="draw" aria-live="assertive"></div>'}
            ${ans ? "" : `<div class="timer" id="timer" style="visibility:hidden"><div class="row"><span>Temps restant</span><span class="secs" id="secs">${R ? RTIME : DTIME} s</span></div><div class="bar"><i id="barfill"></i></div></div>`}
            ${ans ? "" : useBarHTML(p)}<div id="usefx"></div>
            <div class="answers" id="duelAns" style="${ans || R ? "" : "visibility:hidden"}">${["a", "b", "c", "d"].map(l => `<button class="ans" data-l="${l}" disabled>${l.toUpperCase()}</button>`).join("")}</div>
            <div id="fb"></div>
          </div>
        </div>
      </div>`;
    document.querySelectorAll(".team").forEach((el, i) => {
      el.classList.toggle("active", i === pIdx);
      el.classList.toggle("duelist", i === d.me || i === d.opp);
    });
    app.querySelectorAll(".ans").forEach(b => b.onclick = () => answerDuel(b.dataset.l));
    if (!ans) bindUse(p, q); else showUse(q);
    document.getElementById("quit").onclick = () => { S.phase = "end"; renderEnd(); };
    bindSound();
    if (ans) duelFeedback(false);
    else if (d.intro) whenShown(startDraw);
    if (!ans && !d.intro) {
      d.intro = true;
      beep("ch");
      const ov = document.createElement("div");
      ov.className = "overlay";
      ov.innerHTML = R ? `<div class="box"><div class="title" style="color:var(--ok)">Sauvetage !</div>
        <p><strong>${esc(S.teams[d.me].name)}</strong> et <strong>${esc(S.teams[d.opp].name)}</strong> font équipe. Chacun reçoit une question qu'il a ratée, avec d'autres valeurs. <strong>Vous avez le droit de vous entraider !</strong></p>
        <p style="font-size:17px;color:var(--muted)">Chacun a ${RTIME} secondes. Deux bonnes réponses : 2 pépites chacun. Une seule : 1 pépite chacun. Aucune : pas de pépite.</p>
        <button class="primary" id="ready">Commencer le sauvetage</button></div>` : `<div class="box"><div class="title" style="color:#ff8a3d">Castagne !</div>
        <p><strong>${esc(S.teams[d.me].name)}</strong> affronte <strong>${esc(S.teams[d.opp].name)}</strong>. Chacun reçoit une question de ${esc(themeLabel(d.th).toLowerCase())} qu'il a déjà réussie, mais avec d'autres valeurs.</p>
        <p style="font-size:17px;color:var(--muted)">Chacun a ${DTIME} secondes, mais les boutons de réponse n'apparaissent qu'à la fin, pendant « 3, 2, 1, Dégaine ! » : prépare ta réponse ! Les deux justes : 1 pépite chacun. Un seul juste : il gagne les 2 pépites. Les deux faux : personne ne gagne.</p>
        <button class="primary" id="ready">Commencer le duel</button></div>`;
      document.body.appendChild(ov);
      document.getElementById("ready").onclick = () => { ov.remove(); whenShown(startDraw); };
      gateReady(document.getElementById("ready"));
    }
  }

  // "3, 2, 1, Dégaine !" (4 s) before the answer buttons appear, for each duelist
  let drawTimers = [];
  function startDraw() {
    drawTimers.forEach(clearTimeout); drawTimers = [];
    const box = document.getElementById("draw"), ansBox = document.getElementById("duelAns");
    if (S.duel && S.duel.kind === "rescue" && ansBox) {
      const tb0 = document.getElementById("timer");
      if (tb0) tb0.style.visibility = "visible";
      ansBox.querySelectorAll(".ans").forEach(b => { b.disabled = b.classList.contains("gone"); });
      startCountdown(RTIME, () => answerDuel(null));
      return;
    }
    if (!box || !ansBox) return;
    // the timer runs from the start; the answer buttons only show during
    // its last 4 seconds, while "3, 2, 1, Dégaine !" counts down
    const tb = document.getElementById("timer");
    if (tb) tb.style.visibility = "visible";
    startCountdown(DTIME, () => answerDuel(null), true);
    const open = (DTIME - 4) * 1000;
    ["3", "2", "1", "Dégaine !"].forEach((txt, i) => drawTimers.push(setTimeout(() => {
      if (!box.isConnected) return;
      box.textContent = txt;
      box.classList.toggle("go", i === 3);
      beep(i === 3 ? "ch" : "tick");
      if (i === 0) {
        ansBox.style.visibility = "visible";
        ansBox.querySelectorAll(".ans").forEach(b => { b.disabled = b.classList.contains("gone"); });
      }
    }, open + i * 1000)));
  }

  function answerDuel(l) {
    stopTimer();
    drawTimers.forEach(clearTimeout); drawTimers = [];
    const dbox = document.getElementById("draw"); if (dbox) dbox.textContent = "";
    const d = S.duel;
    if ((d.step === 1 && d.a1) || (d.step === 2 && d.a2)) return;
    const q = d.step === 1 ? d.q1 : d.q2;
    const res = { choice: l, ok: l === ANSWER[q], pioche: !!(S.use && S.use.t === "pioche") };
    const p = S.teams[d.step === 1 ? d.me : d.opp];
    p.tot++; if (res.ok) { p.ok++; (p.solved = p.solved || []).push(q); } else (p.failed = p.failed || []).push(q);
    if (d.step === 1) d.a1 = res; else d.a2 = res;
    if (d.step === 2) {
      const A = S.teams[d.me], B = S.teams[d.opp];
      let ga = 0, gb = 0;
      if (d.kind === "rescue") {
        const nOk = (d.a1.ok ? 1 : 0) + (d.a2.ok ? 1 : 0);
        ga = gb = nOk;
        if (nOk) { A.saves = (A.saves || 0) + 1; B.saves = (B.saves || 0) + 1; }
      }
      else if (d.a1.ok && d.a2.ok) { ga = gb = 1; }
      else if (d.a1.ok) { ga = 2; A.duels = (A.duels || 0) + 1; }
      else if (d.a2.ok) { gb = 2; B.duels = (B.duels || 0) + 1; }
      if (d.a1.pioche && ga) ga = boost(ga);
      if (d.a2.pioche && gb) gb = boost(gb);
      A.score += ga; B.score += gb; d.gain = [ga, gb];
      // items: both right in a rescue = an item each for sure (one right: 1 chance out of 2 each); the winner of a castagne steals one
      d.loot = [];
      if (d.kind === "rescue") [[A, ga], [B, gb]].forEach(([P, g]) => { if (g > 0 && ((d.a1.ok && d.a2.ok) || Math.random() < 0.5)) d.loot.push(`${esc(P.name)} trouve ${esc(un(giveItem(P)))} !`); });
      else if (d.a1.ok !== d.a2.ok) {
        const [W, Lo] = d.a1.ok ? [A, B] : [B, A], st = stealItem(Lo, W);
        if (st) d.loot.push(`${esc(W.name)} vole ${esc(le(st))} de ${esc(Lo.name)} !`);
      }
      d.done = true;
      S.answered = { choice: l, ok: res.ok, k: 0 };
    }
    app.querySelectorAll(".ans").forEach(b => b.disabled = true);
    duelFeedback(true);
  }

  function duelFeedback(animate) {
    const d = S.duel;
    const q = d.step === 1 ? d.q1 : d.q2, res = d.step === 1 ? d.a1 : d.a2;
    const right = ANSWER[q];
    app.querySelectorAll(".ans").forEach(b => {
      if (b.dataset.l === right) b.classList.add("right");
      else if (b.dataset.l === res.choice) b.classList.add("wrong");
    });
    const A = S.teams[d.me], B = S.teams[d.opp];
    let msg, cls = res.ok ? "ok" : "ko", btn;
    const verdict = res.ok ? "Bonne réponse !" : res.choice === null ? `Temps écoulé ! La bonne réponse était ${right.toUpperCase()}.` : `Raté ! La bonne réponse était ${right.toUpperCase()}.`;
    if (d.step === 1) {
      msg = verdict;
      btn = `Au tour de ${esc(B.name)}`;
    } else {
      const [ga, gb] = d.gain;
      const pp = g => `${g} pépite${g > 1 ? "s" : ""}`;
      const nOk = (d.a1.ok ? 1 : 0) + (d.a2.ok ? 1 : 0);
      const both = ga === gb ? `${pp(ga)} chacun` : `${pp(ga)} pour ${esc(A.name)}, ${pp(gb)} pour ${esc(B.name)}`;
      const sum = d.kind === "rescue" ? (nOk === 2 ? `Deux bonnes réponses : ${both} !` : nOk === 1 ? `Une bonne réponse : ${both}.` : `Aucune bonne réponse : pas de pépite.`)
        : d.a1.ok && d.a2.ok ? `Les deux ont juste : ${both}.`
        : d.a1.ok ? `${esc(A.name)} remporte la castagne et gagne ${pp(ga)} !`
        : d.a2.ok ? `${esc(B.name)} remporte la castagne et gagne ${pp(gb)} !`
        : `Les deux ont faux : personne ne gagne de pépite.`;
      msg = `${verdict} ${sum}${(d.loot || []).length ? " " + d.loot.join(" ") : ""}`;
      cls = ga || gb ? "ok" : "ko";
      btn = S.timeUp || S.idx === S.deck.length - 1 ? "Voir le classement" : "Question suivante";
    }
    document.getElementById("fb").innerHTML = `<div class="feedback ${cls}">${msg}</div>
      <button class="primary" id="next" style="margin-top:10px;width:100%">${btn}</button>`;
    const nx = document.getElementById("next");
    nx.focus();
    nx.onclick = d.step === 1 ? () => { d.step = 2; S.use = null; renderDuel(); } : next;
    refreshInv();
    if (d.step === 2) {
      [d.me, d.opp].forEach((i, j) => {
        const card = document.getElementById("team" + i);
        card.querySelector(".score span").textContent = S.teams[i].score;
        card.querySelector(".meta").textContent = `${S.teams[i].ok} / ${S.teams[i].tot} bonnes réponses`;
        if (animate && d.gain[j]) {
          const from = document.querySelector(".ans.right");
          if (from) flyNuggets(d.gain[j], card);
          setTimeout(() => { card.classList.remove("bump"); void card.offsetWidth; card.classList.add("bump"); }, 850);
        }
      });
      if (animate) beep(d.gain[0] || d.gain[1] ? "ok" : "ko");
    } else {
      const card = document.getElementById("team" + d.me);
      card.querySelector(".meta").textContent = `${A.ok} / ${A.tot} bonnes réponses`;
      if (animate) beep(res.ok ? "ok" : "ko");
    }
  }

  function next() {
    if (S.timeUp || S.idx >= S.deck.length - 1) { S.phase = "end"; renderEnd(); return; }
    S.idx++; S.answered = null; S.duel = null; S.use = null; S.fpart = {};
    renderPlay();
  }

  function renderEnd() {
    stopTimer();
    if (clock) { clearInterval(clock); clock = null; }
    document.querySelectorAll(".overlay").forEach(o => o.remove());
    const ranked = S.teams.map(t => t).sort((a, b) => b.score - a.score || b.ok - a.ok);
    let pos = 0, prev = null;
    const rows = ranked.map((t, i) => {
      if (prev === null || t.score !== prev) pos = i + 1;
      prev = t.score;
      return `<div class="rank ${pos === 1 ? "first" : ""}"><span class="pos">${pos}</span>
        <div style="min-width:0;--pc:${pc(S.teams.indexOf(t))}"><div class="nm">${esc(t.name)}</div><div class="det">${t.ok} bonne${t.ok > 1 ? "s" : ""} réponse${t.ok > 1 ? "s" : ""} sur ${t.tot} · ${t.ch} filon${t.ch > 1 ? "s" : ""} exploité${t.ch > 1 ? "s" : ""} · ${t.fa || 0} filon${(t.fa || 0) > 1 ? "s" : ""} partagé${(t.fa || 0) > 1 ? "s" : ""} · ${t.vols || 0} chapardage${(t.vols || 0) > 1 ? "s" : ""} réussi${(t.vols || 0) > 1 ? "s" : ""} · ${t.duels || 0} castagne${(t.duels || 0) > 1 ? "s" : ""} gagnée${(t.duels || 0) > 1 ? "s" : ""} · ${t.saves || 0} sauvetage${(t.saves || 0) > 1 ? "s" : ""} réussi${(t.saves || 0) > 1 ? "s" : ""}</div></div>
        <span class="pts">${NUG}${t.score}</span></div>`;
    }).join("");
    const best = ranked[0];
    app.innerHTML = header() + `
      <section class="panel" style="gap:16px">
        <h2 style="font-family:var(--f-display);font-weight:400;color:var(--gold);margin:0;font-size:clamp(26px,5vw,40px);text-wrap:balance">${S.teams.length > 1 ? `${esc(best.name)} remporte la ruée vers l'or !` : `Tu as récolté ${best.score} pépite${best.score > 1 ? "s" : ""} !`}</h2>
        <div class="podium">${rows}</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="primary" id="again">Rejouer avec les mêmes joueurs</button>
          <button class="ghost" id="setup">Changer les réglages</button>
        </div>
      </section>`;
    document.getElementById("again").onclick = start;
    document.getElementById("setup").onclick = () => { S.phase = "setup"; renderSetup(); };
    bindSound();
    if (best && best.score > 0) beep("ok");
  }

  function bindSound() {
    const b = document.getElementById("snd");
    if (b) b.onclick = () => { S.sound = !S.sound; b.textContent = S.sound ? "Son : activé" : "Son : coupé"; b.setAttribute("aria-pressed", S.sound); };
  }

  document.addEventListener("keydown", e => {
    if (S.phase !== "play" || e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (document.querySelector(".overlay")) { if (k === "enter" || k === " ") { e.preventDefault(); document.getElementById("ready").click(); } return; }
    const l = ["1", "2", "3", "4"].includes(k) ? "abcd"[+k - 1] : k;
    const btn = document.querySelector(`.ans[data-l="${l}"]`);
    if (["a", "b", "c", "d"].includes(l) && btn && !btn.disabled) btn.click();
    else if (k === "enter") { const nx = document.getElementById("next"); if (nx) { e.preventDefault(); nx.click(); } }
  });

  function boot() {
    if (S.phase === "play" && S.deck.length) renderPlay();
    else if (S.phase === "end" && S.teams.length) renderEnd();
    else { S.phase = "setup"; renderSetup(); }
  }
  boot();
  // question images are packed by 10 into packs/<level>_<k>.js, loaded on demand
  const packWait = {};
  function loadPack(key) {
    if ((window.IMGPACK || {})[key]) return Promise.resolve();
    if (!packWait[key]) packWait[key] = new Promise((ok, ko) => {
      const sc = document.createElement("script");
      sc.src = "packs/" + key + ".js"; sc.onload = ok;
      sc.onerror = () => { delete packWait[key]; ko(); };
      document.head.appendChild(sc);
    });
    return packWait[key];
  }
  const packOf = q => { const [pre, n] = imgRef(q); return pre + "_" + Math.floor((n - 1) / 10); };
  function fillImgs() {
    document.querySelectorAll("img[data-q]:not([src])").forEach(im => {
      const q = +im.dataset.q, key = packOf(q), n = imgRef(q)[1];
      im.setAttribute("src", "data:image/gif;base64,R0lGODlhAQABAAAAACw=");
      loadPack(key).then(() => { im.src = window.IMGPACK[key][n]; }).catch(() => im.removeAttribute("src"));
    });
    // fetch ahead the next question of the deck
    try { const nx = S.deck && S.deck[S.idx + 1]; if (nx) loadPack(packOf(nx)).catch(() => {}); } catch (e) {}
  }
  new MutationObserver(fillImgs).observe(document.body, { childList: true, subtree: true });
  fillImgs();

})();

</script>

</body>
</html>
